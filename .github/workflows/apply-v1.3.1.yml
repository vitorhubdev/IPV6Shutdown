name: Apply v1.3.1 fixes

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/apply-v1.3.1.yml"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  apply:
    name: Apply and validate v1.3.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Reassemble and verify audited patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem '.github/tmp/v131/part-*' | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 payload parts, got $($parts.Count)" }
          $payload = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllText('patch_v131.b64', $payload, [Text.Encoding]::ASCII)
          $actual = (Get-FileHash 'patch_v131.b64' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '594bb42cebd69bf711fedc2cd82cc8512eecd67ae2eda811efa3c7564165e770'
          if ($actual -ne $expected) { throw "Payload SHA-256 mismatch: $actual" }
          [IO.File]::WriteAllBytes('patch_v131.py', [Convert]::FromBase64String($payload))
          $scriptHash = (Get-FileHash 'patch_v131.py' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($scriptHash -ne 'b9d7b1180ed7ee3d0512c7210d547e1aedf1200c8ea0dac6349b31d1e8b5fefd') { throw "Decoded script SHA-256 mismatch: $scriptHash" }
          python patch_v131.py

      - name: Run tests
        run: dotnet test IPV6Shutdown.slnx -c Release

      - name: Validate diff
        shell: pwsh
        run: |
          git diff --check
          git status --short

      - name: Commit implementation to master
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Program.cs WatchdogTaskValidation.cs IPV6Shutdown.Tests/WatchdogTaskValidationTests.cs IPV6Shutdown.csproj README.md CHANGELOG.md .github/workflows/publish-aot.yml
          git commit -m "fix: make IPv6 watchdog persistent (v1.3.1)"
          git push origin HEAD:master
