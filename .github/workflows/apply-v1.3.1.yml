name: Apply v1.3.1 fixes

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/apply-v1.3.1.yml"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  apply:
    name: Apply and validate v1.3.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Apply audited fixes
        shell: pwsh
        run: |
          $payload = '（'<SECRET>''
          [IO.File]::WriteAllBytes('patch_v131.py', [Convert]::FromBase64String($payload))
          python patch_v131.py

      - name: Run tests
        run: dotnet test IPV6Shutdown.slnx -c Release

      - name: Validate diff
        shell: pwsh
        run: |
          git diff --check
          git status --short

      - name: Commit implementation to master
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Program.cs WatchdogTaskValidation.cs IPV6Shutdown.Tests/WatchdogTaskValidationTests.cs IPV6Shutdown.csproj README.md CHANGELOG.md .github/workflows/publish-aot.yml
          git commit -m "fix: make IPv6 watchdog persistent (v1.3.1)"
          git push origin HEAD:master
